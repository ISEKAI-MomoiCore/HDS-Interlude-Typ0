# electron-builder 配置（0.0.1-m4 首发：NSIS 安装包 + Portable 双目标）
# 构建命令：npm run dist（需先 npm run build）
# 关键决策：
#  - asar: false —— typ0 用 child_process.fork 起真 node 子进程跑 Koishi worker，
#    纯 node 读不了 asar 虚拟文件系统；AGPL 开源无藏码需求，关闭 asar 整类规避
#    worker fork / WASM 资产（@minatojs/sql.js）的 asar 问题。
#  - 数据库驱动是 WASM（sql.js），无原生模块需要 rebuild。
#  - portable 目标由 electron-builder 注入 PORTABLE_EXECUTABLE_DIR；主进程据此
#    把 dataRoot 重定向到 exe 旁的 typ0-data/（见 main.ts）。
appId: mo.momoicore.hds-interlude-typ0
productName: HDS-Interlude-Typ0
copyright: Copyright © 2026 ISEKAI-MomoiCore · AGPL-3.0
directories:
  output: release
  buildResources: build
asar: false
files:
  - dist/**
  - build/icon.ico
  - build/icon-png/**
  - build/twemoji-2615.svg
  - package.json
  - "!**/*.map"
  - "!vendor/**"
win:
  icon: build/icon.ico
  target:
    - target: nsis
    - target: portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: HDS-Interlude-Typ0-Setup-${version}.${ext}
portable:
  artifactName: HDS-Interlude-Typ0-Portable-${version}.${ext}

# Linux（0.0.1-m5 实验性交叉构建：Windows 上可产出 AppImage + tar.gz）：
#  - 运行时边界见 README/RELEASE-NOTES：密钥需桌面环境 keyring（safeStorage/
#    libsecret），无 keyring 的无头环境密钥不可用（就绪检查有指引）；SnowLuma
#    检测为 Windows 专属，Linux 上按 unknown 降级；插件安装需系统 PATH 有 npm。
#  - 便携语义（数据随 exe）是 Windows portable 目标专属；AppImage 数据落在
#    ~/.config/hdsi-desktop。
linux:
  icon: build/icon-png
  category: Utility
  artifactName: HDS-Interlude-Typ0-linux-${version}.${ext}
  target:
    - AppImage
    - tar.gz
appImage:
  artifactName: HDS-Interlude-Typ0-AppImage-${version}.${ext}
# AppImage 交叉构建需要创建符号链接（Windows 需开发者模式或管理员；本机无此
# 权限，本地交付 tar.gz，AppImage 留给 CI/Linux 环境构建）。本地只打 tar.gz：
#   npx electron-builder --linux tar.gz
